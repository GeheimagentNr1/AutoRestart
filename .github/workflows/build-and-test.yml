name: Build and Test

on:
  push:
    branches:
      - 'master_*'
      - 'develop_*'
  pull_request:
    branches:
      - 'master_*'
      - 'develop_*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Only set in repositories that compile against other mods from the private ModdingMavenRepositories
      MODDING_MAVEN_TOKEN: ${{ secrets.MODDING_MAVEN_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The Java version is taken from the toolchain in build.gradle (21 for 1.21.x, 25 for 26.x)
      - name: Determine Java version
        id: java
        run: |
          version=$(grep -oP 'JavaLanguageVersion\.of\(\s*\K[0-9]+' build.gradle | head -1)
          echo "version=${version:-21}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK ${{ steps.java.outputs.version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ steps.java.outputs.version }}
          distribution: 'temurin'

      - name: Checkout ModdingMavenRepositories
        if: env.MODDING_MAVEN_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: GeheimagentNr1/ModdingMavenRepositories
          token: ${{ secrets.MODDING_MAVEN_TOKEN }}
          path: .ci-maven
          sparse-checkout: |
            de/geheimagentnr1/manyideas_core
            de/geheimagentnr1/recipes_lib
            de/geheimagentnr1/dimension_access_manager
            de/geheimagentnr1/moremobgriefingoptions

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # gradle.properties may contain a local Windows org.gradle.java.home; the command line value takes precedence
      - name: Determine Gradle arguments
        run: |
          args="-Dorg.gradle.java.home=$JAVA_HOME"
          if [ -d .ci-maven ]; then
            # relative: older branches build the URL as "file:" + projectDir + "/" + local_repository_path
            args="$args -Plocal_repository_path=.ci-maven"
          fi
          echo "GRADLE_ARGS=$args" >> "$GITHUB_ENV"

      - name: Build and run unit tests
        run: ./gradlew build --no-daemon $GRADLE_ARGS

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: build/reports/tests/
          if-no-files-found: ignore

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/*.jar
