# suppress inspection "LongLine" for whole file
# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false


## Environment Properties

# The Minecraft version must agree with the NeoForge version to get a valid artifact
minecraft_version=1.21.1
# The Minecraft version range can use any release version of Minecraft as bounds.
# Snapshots, pre-releases, and release candidates are not guaranteed to sort properly
# as they do not follow standard versioning conventions.
minecraft_version_range=[1.21.1,1.21.11)
minecraft_versions=["1.21.1","1.21.2","1.21.3","1.21.4","1.21.5","1.21.6","1.21.7","1.21.8","1.21.9","1.21.10"]
# The NeoForge version must agree with the Minecraft version to get a valid artifact
# See https://projects.neoforged.net/neoforged/neoforge for available versions
neoforge_version=21.1.216
# The NeoForge version range can use any version of NeoForge as bounds
neoforge_version_range=[21.1,)
# The loader version range can only use the major version of FML as bounds
loader_version_range=[4,)


## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=auto_restart
# The human-readable display name for the mod.
mod_name=Auto Restart
# The license of the mod. Review your options at https://choosealicense.com/. All Rights Reserved is the default.
mod_license=All Rights Reserved
# The mod version. See https://semver.org/
mod_version=3.0.0
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
# See https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=de.geheimagentnr1
# The authors of the mod. This is a simple text string that is used for display purposes in the mod list.
mod_authors=GeheimagentNr1
# The description of the mod. This is a simple multiline text string that is used for display purposes in the mod list.
mod_description=Adds auto restarting to Minecraft servers.

# A URL to refer people to when problems occur with this mod
issueTrackerURL=https://github.com/GeheimagentNr1/AutoRestart/issues
# A URL for the "homepage" for this mod, displayed in the mod UI
displayURL=https://www.curseforge.com/minecraft/mc-mods/auto-restart
# A file name (in the root of the mod JAR) containing a logo for display
logoFile=auto_restart.png
# A text field displayed in the mod UI
credits=Thanks for the logo goes to Muse31
# Display Test controls the display for your mod in the server connection screen
# MATCH_VERSION means that your mod will cause a red X if the versions on client and server differ. This is the default behaviour and should be what you choose if you have server and client elements to your mod.
# IGNORE_SERVER_VERSION means that your mod will not cause a red X if it's present on the server but not on the client. This is what you should use if you're a server only mod.
# IGNORE_ALL_VERSION means that your mod will not cause a red X if it's present on the client or the server. This is a special case and should only be used if your mod has no server component.
# NONE means that no display test is set on your mod. You need to do this yourself, see IExtensionPoint.DisplayTest for more information. You can define any scheme you wish with this value.
# IMPORTANT NOTE: this is NOT an instruction as to which environments (CLIENT or DEDICATED SERVER) your mod loads on. Your mod should load (and maybe do nothing!) whereever it finds itself.
displayTest=IGNORE_SERVER_VERSION

modDependencies=

